<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NotiBox · TrendX Apps</title>
<meta name="description" content="놓친 알림을 한곳에 모아 보관·검색하는 알림 보관함.">
<style>
  :root{--ink:#1d1a20;--mute:#6f6870;--line:#e8e3e8;--bg:#fbf9fb;--card:#fff;--accent:#7c5ceb}
  @media (prefers-color-scheme:dark){
    :root{--ink:#f2eef2;--mute:#a79fa8;--line:#2e2832;--bg:#141216;--card:#1c191e;--accent:#c9b8ff}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;
       line-height:1.65;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:56px 20px 80px}
  .back{display:inline-block;color:var(--mute);text-decoration:none;font-size:14px;margin-bottom:32px}
  .back:hover{color:var(--accent)}
  h1{font-size:32px;letter-spacing:-.02em;margin:0 0 10px}
  .tag{color:var(--mute);font-size:17px;margin:0 0 32px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:16px}
  h2{font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:0 0 12px;font-weight:600}
  ul{margin:0;padding-left:20px} li{margin-bottom:6px}
  .stores{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .stores a{font-size:14px;font-weight:600;text-decoration:none;color:#fff;background:var(--accent);
            border-radius:999px;padding:11px 22px}
  .stores a:hover{opacity:.9}
  footer{margin-top:44px;padding-top:22px;border-top:1px solid var(--line);color:var(--mute);font-size:13px}
  footer a{color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← TrendX Apps</a>
  <h1>NotiBox</h1>
  <p class="tag">놓친 알림을 한곳에 모아 보관·검색하는 알림 보관함.</p>

  <div class="card">
    <h2>이런 걸 할 수 있어요</h2>
    <ul><li>지나간 알림을 다시 확인</li><li>앱별로 모아 보고 검색까지</li><li>필요한 알림만 골라 보관</li></ul>
  </div>

  <div class="card">
    <h2>다운로드</h2>
    <div class="stores"><a href="https://play.google.com/store/apps/details?id=com.notibox.app">Google Play</a></div>
  </div>

  <footer>
    <p>문의 <a href="mailto:dys0707y@gmail.com">dys0707y@gmail.com</a></p>
  </footer>
</div>
</body>
</html>

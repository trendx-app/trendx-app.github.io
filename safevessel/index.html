<script>
  /* 앱과 같은 테마 결정 — 로그인 전후로 색이 번쩍 바뀌지 않게 */
  (function () {
    try {
      var t = localStorage.getItem('sv-theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* 사생활 보호 모드 — 기본값 */ }
  })();
</script>

<style id="lockStyle">
  /* 토큰은 web/css/app.css 와 같은 값 — 로그인 전에는 앱 CSS 가 암호화돼 있어 여기 따로 둔다 */
  :root {
    color-scheme: light;
    --plane: #f4f5f3; --surface: #ffffff; --surface-sunk: #f0f1ee;
    --ink: #0b0b0b; --ink-2: #52514e; --ink-muted: #7c7b75;
    --border: rgba(11,11,11,.10); --border-strong: rgba(11,11,11,.16);
    --accent: #184f95; --accent-ink: #ffffff;
    --danger: #b3261e; --danger-soft: #fbe9e9;
    --radius: 14px; --radius-sm: 9px;
    --shadow-lg: 0 2px 6px rgba(11,11,11,.07), 0 20px 50px rgba(11,11,11,.10);
    --sans: system-ui, -apple-system, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Segoe UI", sans-serif;
    --dur: 180ms; --ease: cubic-bezier(.2, .7, .3, 1);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --plane: #0d0d0d; --surface: #1a1a19; --surface-sunk: #131312;
    --ink: #ffffff; --ink-2: #c3c2b7; --ink-muted: #898781;
    --border: rgba(255,255,255,.10); --border-strong: rgba(255,255,255,.18);
    --accent: #3987e5; --accent-ink: #08111d;
    --danger: #ff8a80; --danger-soft: #2d1414;
    --shadow-lg: 0 2px 6px rgba(0,0,0,.5), 0 20px 50px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--plane); color: var(--ink); font-family: var(--sans); }
  /* ⚠️ 100dvh 는 **키보드가 올라오면 줄어든다.** place-items:center 와 함께 쓰면
     글자를 한 자 칠 때마다 카드가 다시 가운데로 튀고, 그때 입력칸이 포커스를 잃어
     키보드가 내려간다(2026-09-30 회장님 보고). svh 는 키보드와 무관하게 고정이다. */
  .lock { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; }
  @media (max-width: 560px) {
    /* 폰에서는 아예 위에 붙여 둔다 — 높이가 변해도 움직일 일이 없다 */
    .lock { align-items: start; padding-top: 32px; }
  }
  .lock__card {
    width: 100%; max-width: 384px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-lg);
    padding: 32px 28px 24px;
    animation: lock-in 240ms var(--ease) both;
  }
  @keyframes lock-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .lock__card { animation: none; } }

  .lock__brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .lock__mark {
    width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
    background: var(--surface-sunk); border: 1px solid var(--border); font-size: 24px;
  }
  .lock__name { font-weight: 800; font-size: 18px; letter-spacing: -.01em; }
  .lock__sub { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
  .lock h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.01em; }
  .lock__lead { font-size: 14px; line-height: 1.5; color: var(--ink-2); margin: 0 0 20px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 14px; font-weight: 650; margin-bottom: 6px; }
  .field__row { position: relative; }
  .field input {
    width: 100%; height: 48px; padding: 0 14px; font: inherit; font-size: 16px;
    color: var(--ink); background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  }
  .field input.has-toggle { padding-right: 72px; }
  /* 비밀번호 가림 — type="password" 를 쓰지 않고 글자만 가린다.
     휴대폰 브라우저(특히 삼성 인터넷의 삼성 패스)는 type="password" 를 보면
     autocomplete="off" 를 무시하고 자동완성 시트를 띄운다. 그 시트가 키보드를 닫는다. */
  .field input.is-secret { -webkit-text-security: disc; text-security: disc; }
  .field input:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
  .field input[aria-invalid="true"] { border-color: var(--danger); }
  .pw-toggle {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    min-width: 60px; height: 40px; padding: 0 10px; border: 0; border-radius: 7px;
    background: transparent; color: var(--ink-2); font: inherit; font-size: 13px; font-weight: 650; cursor: pointer;
  }
  .pw-toggle:hover { background: var(--surface-sunk); }
  .pw-toggle:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 1px; }

  /* 인앱 브라우저 안내 띠 */
  .lock__inapp {
    display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
    padding: 12px 14px; border-radius: var(--radius-sm);
    background: #fff5e5; border: 1px solid #f0c987; color: #6b4700;
  }
  :root[data-theme="dark"] .lock__inapp { background: #2e2413; border-color: #6b5220; color: #ffd89b; }
  .lock__inapp[hidden] { display: none; }
  .lock__inapp b { display: block; font-size: 13.5px; line-height: 1.4; }
  .lock__inapp small { display: block; font-size: 11.8px; line-height: 1.45; margin-top: 3px; opacity: .9; }
  .lock__inapp button {
    flex: 0 0 auto; align-self: stretch; min-width: 92px; padding: 8px 12px;
    border: 0; border-radius: 7px; cursor: pointer;
    background: #8a5a00; color: #fff; font: inherit; font-size: 12.5px; font-weight: 750; line-height: 1.3;
  }

  .lock__error {
    display: none; margin: 0 0 16px; padding: 10px 12px; border-radius: var(--radius-sm);
    background: var(--danger-soft); color: var(--danger); font-size: 14px; line-height: 1.45; font-weight: 600;
  }
  .lock__error.is-on { display: block; }

  .lock__btn {
    width: 100%; height: 48px; border: 0; border-radius: var(--radius-sm); cursor: pointer;
    background: var(--accent); color: var(--accent-ink); font: inherit; font-size: 16px; font-weight: 750;
    transition: filter var(--dur) var(--ease), transform 90ms var(--ease);
  }
  .lock__btn:hover { filter: brightness(1.08); }
  .lock__btn:active { transform: scale(.985); }
  .lock__btn:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
  .lock__btn[disabled] { cursor: progress; filter: saturate(.6) brightness(.95); }
  @media (prefers-reduced-motion: reduce) { .lock__btn, .field input { transition: none; } .lock__btn:active { transform: none; } }

  .lock__open { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line, #e5e5e5); }
.lock__openbtn { display: flex; align-items: center; gap: 10px; text-decoration: none;
  padding: 12px 14px; border-radius: 10px; border: 1px solid #cfd8e3; background: #f4f8fd;
  color: inherit; transition: background .15s, border-color .15s; }
.lock__openbtn:hover { background: #e8f1fb; border-color: #9fbfe0; }
.lock__openbtn b { display: block; font-size: 14px; }
.lock__openbtn small { display: block; font-size: 11.5px; color: #5b6675; margin-top: 2px; }
.lock__openbtn > span:nth-child(1) { font-size: 20px; }
.lock__arrow { margin-left: auto; font-size: 20px; color: #7a8796; }
.lock__foot { margin: 20px 0 0; font-size: 12.5px; line-height: 1.5; color: var(--ink-2); text-align: center; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

<body>
<main class="lock">
  <section class="lock__card" aria-labelledby="lockTitle">
    <div class="lock__brand">
      <span class="lock__mark"><svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="-1.46 -2.05 39.04 39.04" aria-hidden="true" role="presentation" aria-label="정부상징 태극 문양"> <g> <path d="M27.02 16.699a6.316 6.316 0 0 0-8.976 1.89 6.315 6.315 0 0 1-11.417-1.742v-.14a8.198 8.198 0 0 1-.327-2.513c0-5.662 5.81-11.962 14.179-11.962a15.944 15.944 0 0 1 14.723 10.111c0-.062 0-.124-.062-.194A18.037 18.037 0 0 0 .039 18.006c0 8.905 6.424 16.527 15.33 16.527a14.497 14.497 0 0 0 14.07-9.473A7.001 7.001 0 0 0 27.02 16.7Z" fill="#003863"/> <path d="M35.295 12.724A15.905 15.905 0 0 0 20.44 2.232c-8.369 0-14.179 6.3-14.179 11.962-.022.85.088 1.697.327 2.513a5.344 5.344 0 0 1-.164-1.292c0-5.895 5.904-9.978 11.97-9.978a14.872 14.872 0 0 1 14.872 14.87 16.387 16.387 0 0 1-9.093 14.677 18.068 18.068 0 0 0 11.122-22.26Z" fill="#E4032E"/> </g> </svg></span>
      <span>
        <span class="lock__name">SafeVessel</span>
        <span class="lock__sub" style="display:block">어선·어선원 안전ON</span>
      </span>
    </div>

    <h1 id="lockTitle">담당자 로그인</h1>
    <p class="lock__lead">권한을 받은 담당자만 이용할 수 있습니다.</p>

    <!-- ⚠️ 휴대폰 브라우저가 이 화면을 '로그인 폼'으로 인식하면 안 된다.
         인식하는 순간 저장된 비밀번호·비밀번호 생성 제안 시트가 뜨고, 그 시트가 뜰 때마다
         키보드가 내려간다(빈칸일 때·첫 글자를 칠 때·다 지웠을 때 = 값이 바뀔 때마다).
         제안이 적용되면 치던 글자를 통째로 덮어쓴다.
         2026-09-30 회장님 보고 — 자동완성 힌트만 끄는 것으로는 **막히지 않았다.**
         휴대폰 브라우저는 type="password" 를 보면 힌트를 무시하고 관리자를 띄운다.

         그래서 인식 재료를 전부 없앴다.
           · <form> 을 쓰지 않는다 (폼이 없으면 '제출할 로그인 폼'이 아니다)
           · 비밀번호 칸을 type="password" 로 두지 않는다 —
             글자는 CSS(-webkit-text-security)로 가린다. 화면에는 똑같이 ●●● 로 보인다.
           · name 을 주지 않는다. 자동완성·외부 관리자에도 무시하라고 표시한다.
         (비밀번호를 브라우저에 저장할 필요가 없는 화면이다. 기억은 탭 세션이 맡는다.) -->
    <!-- 카카오톡·페이스북 등 앱 안에 딸린 브라우저(인앱 브라우저)로 열렸을 때만 보인다.
         인앱 브라우저는 입력칸·키보드 처리가 불안정해 글자가 안 쳐지는 일이 있다
         (2026-09-30 실제: 카톡 링크로 열면 키보드가 계속 내려갔고, 크롬으로 열면 정상). -->
    <div class="lock__inapp" id="inappBar" hidden>
      <div>
        <b>지금 카카오톡 안의 브라우저로 열렸습니다.</b>
        <small>이 상태에서는 아이디·비밀번호가 잘 입력되지 않을 수 있습니다.</small>
      </div>
      <button type="button" id="inappOpen">기본 브라우저로 열기</button>
    </div>

    <div id="loginForm" role="group" aria-labelledby="lockTitle">
      <p class="lock__error" id="loginError" role="alert" aria-live="assertive"></p>

      <div class="field">
        <label for="loginId">아이디</label>
        <input id="loginId" type="text" inputmode="text" enterkeyhint="next"
               autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"
               data-lpignore="true" data-1p-ignore data-form-type="other">
      </div>

      <div class="field">
        <label for="loginPw">비밀번호</label>
        <div class="field__row">
          <!-- type="text" 다. 가림은 .is-secret 클래스가 한다 (위 주석 참고). -->
          <input id="loginPw" type="text" class="has-toggle is-secret" enterkeyhint="go"
                 autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"
                 aria-describedby="pwHint"
                 data-lpignore="true" data-1p-ignore data-form-type="other">
          <button type="button" class="pw-toggle" id="pwToggle" aria-controls="loginPw" aria-pressed="false">보기</button>
        </div>
        <span id="pwHint" class="sr-only">입력한 글자는 화면에서 가려집니다. 오른쪽 보기 단추로 확인할 수 있습니다.</span>
      </div>

      <button type="button" class="lock__btn" id="loginBtn">로그인</button>
    </div>

    <div class="lock__open">
      <a class="lock__openbtn" href="open/">
        <span aria-hidden="true">🌊</span>
        <span>
          <b>로그인 없이 해상위험정보 보기</b>
          <small>어선·어선원용 — 출항 전 기상·사고 확인</small>
        </span>
        <span class="lock__arrow" aria-hidden="true">›</span>
      </a>
    </div>

    <p class="lock__foot">공개 데이터 기반 시범 서비스</p>
  </section>
</main>
<noscript>
  <p style="text-align:center;padding:16px;font-family:system-ui">이 화면은 자바스크립트를 켜야 열립니다.</p>
</noscript>

<script>
(function () {
  'use strict';

  /* 빌드가 채운다 (tools/lock/build_locked.mjs). salt·반복횟수는 비밀이 아니다. */
  const SALT_B64 = 'm2ctOzZ5UxviO83H7DyOkg==';
  const ITER = 600000;
  const BUILD = 'c631444c02a8';
  const KEY_STORE = 'sv-lock-key';

  /* 위 세 값은 **빌드마다 바뀐다**(매일 자동 갱신). 브라우저가 옛 화면을 캐시에서 주면
     새 암호문과 짝이 안 맞는다. 예전에는 그때 화면을 통째로 새로고침했는데, 폰에서
     그 새로고침이 **올라온 키보드를 닫아** 버렸다(2026-09-30 회장님 보고).
     그래서 값만 갈아끼울 수 있게 변수로 둔다 — 화면은 그대로, 사용자는 모른다. */
  let salt = SALT_B64;
  let iters = ITER;
  let build = BUILD;

  const $ = (id) => document.getElementById(id);
  const te = new TextEncoder();
  const nativeFetch = window.fetch.bind(window);
  let KEY = null;

  const b64d = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  function b64e(u8) {
    let s = '';
    for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
    return btoa(s);
  }

  function showError(msg) {
    const el = $('loginError');
    if (!el) return;
    el.textContent = msg;
    el.classList.toggle('is-on', !!msg);
  }

  function setBusy(on, label) {
    const btn = $('loginBtn');
    if (!btn) return;
    btn.disabled = on;
    btn.textContent = on ? label : '로그인';
    $('loginForm').setAttribute('aria-busy', on ? 'true' : 'false');
    // ⚠️ 예전에는 여기서 입력칸을 readOnly 로 만들었다. 휴대폰에서 readOnly 칸은
    //    탭해도 키보드가 안 뜨고, 풀린 뒤 **다시 눌러야** 들어간다
    //    (2026-09-30 "첫 글자는 써지지도 않고 두번눌러야 들어가네").
    //    처리 중에 사용자가 더 쳐도 해로울 것이 없으므로 버튼만 비활성으로 둔다.
  }

  /* 캐시 어긋남 방지 (2026-09-18 실제 사고: 배포 직후 브라우저가 옛 로그인 화면(옛 salt)을 캐시에서 쓰고
     새 암호문을 받아 '자격 불일치'가 났고, 다른 탭에선 옛 화면+옛 암호문 짝으로 열려 새 이름이 안 보였다).
     GitHub Pages 는 파일을 10분 캐시한다. 그래서 열릴 때마다 서버의 build.json(캐시 금지)을 읽어
     이 화면의 BUILD 와 다르면 화면 자체를 서버에서 다시 받아 새로고침한다. 무한 반복은 세션 표시로 막는다. */
  const RELOAD_MARK = 'sv.reloaded.for';

  /** 이 화면의 열쇠 재료(salt·반복횟수·빌드)를 새 것으로 갈아끼운다.
      새로고침 없이 해내는 것이 요점이다 — 새로고침은 폰에서 키보드를 닫는다. */
  function swapBuildFrom(html, server) {
    const s = (html.match(/const SALT_B64 = '([^']+)'/) || [])[1];
    const i = Number((html.match(/const ITER = (\d+)/) || [])[1]);
    const b = (html.match(/const BUILD = '([^']+)'/) || [])[1];
    if (!s || !i || !b || b !== server) return false;   // 하나라도 못 읽으면 갈아끼우지 않는다
    salt = s; iters = i; build = b;
    return true;
  }

  async function ensureFresh(reason) {
    let server = null;
    try {
      const r = await nativeFetch('build.json?t=' + Date.now(), { cache: 'no-store' });
      if (r.ok) server = (await r.json()).build || null;
    } catch (e) { return false; }          // 오프라인·차단 — 판단 보류, 지금 화면으로 진행
    if (!server || server === build) return false;

    /* ① 새로고침하지 않고 값만 갈아끼워 본다. 성공하면 사용자는 아무것도 못 느낀다.
          (입력 중이던 글자도, 올라온 키보드도 그대로 남는다.) */
    try {
      const r2 = await nativeFetch(location.pathname + '?t=' + Date.now(), { cache: 'reload' });
      if (r2.ok && swapBuildFrom(await r2.text(), server)) {
        try { sessionStorage.removeItem(KEY_STORE); } catch (e) { /* 무시 */ }
        return false;                      // 새 재료로 이 화면에서 그대로 진행한다
      }
    } catch (e) { /* 아래 새로고침으로 내려간다 */ }

    /* ② 갈아끼우지 못했을 때만 새로고침한다. 사용자가 입력 중이면 **그 순간에는 하지 않고**
          로그인 시도 때로 미룬다 — 타이핑 중 화면이 날아가는 것이 가장 나쁘다. */
    if (reason === 'start' && isUserBusyTyping()) { pendingBuild = server; return false; }

    let already = null;
    try { already = sessionStorage.getItem(RELOAD_MARK); } catch (e) { /* 무시 */ }
    if (already === server) return false;  // 이미 한 번 새로고침했는데도 다르면 반복하지 않는다
    try { sessionStorage.setItem(RELOAD_MARK, server); sessionStorage.removeItem(KEY_STORE); } catch (e) { /* 무시 */ }
    setBusy(true, '새 버전을 받는 중…');
    location.reload();
    return true;
  }

  /** 지금 사용자가 입력칸에서 무언가 하고 있는가 (포커스 중이거나 이미 뭔가 쳤거나). */
  let pendingBuild = null;
  function isUserBusyTyping() {
    const id = $('loginId');
    const pw = $('loginPw');
    if (!id || !pw) return false;
    const a = document.activeElement;
    return a === id || a === pw || !!id.value || !!pw.value;
  }

  async function deriveKey(id, pw) {
    const base = await crypto.subtle.importKey('raw', te.encode(id + String.fromCharCode(0) + pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', hash: 'SHA-256', salt: b64d(salt), iterations: iters },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }

  async function openSealed(buf) {
    const u8 = new Uint8Array(buf);
    if (u8.length < 32 || String.fromCharCode(u8[0], u8[1], u8[2], u8[3]) !== 'SVL1') throw new Error('형식이 맞지 않습니다');
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8.subarray(4, 16) }, KEY, u8.subarray(16));
  }

  async function loadBundle() {
    const res = await nativeFetch('app.bundle.enc?b=' + build, { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const buf = await res.arrayBuffer();
    let plain;
    try { plain = await openSealed(buf); } catch (e) { const err = new Error('자격 불일치'); err.bad = true; throw err; }
    return JSON.parse(new TextDecoder().decode(plain));
  }

  /* 앱은 fetch('data/이름.json') 으로 자료를 부른다 — 암호문(.enc)을 받아 풀어서 같은 모양으로 돌려준다. */
  function installFetch() {
    const re = /(^|\/)data\/([A-Za-z0-9_-]+)\.json(?:[?#].*)?$/;
    window.fetch = async function (input, init) {
      const url = typeof input === 'string' ? input : (input && input.url) || '';
      const m = url.match(re);
      if (!m) return nativeFetch(input, init);
      const encUrl = url.replace(re, (all, pre, name) => pre + 'data/' + name + '.enc');
      const res = await nativeFetch(encUrl + '?b=' + build, { cache: 'no-cache' });
      if (!res.ok) return new Response('', { status: res.status, statusText: res.statusText });
      const plain = await openSealed(await res.arrayBuffer());
      return new Response(plain, { status: 200, headers: { 'Content-Type': 'application/json; charset=utf-8' } });
    };
  }

  function addLogout() {
    const bar = document.querySelector('.topbar__inner');
    if (!bar) return;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.id = 'svLogout';
    btn.className = 'icon-btn icon-btn--wide';
    btn.title = '로그아웃';
    btn.innerHTML = '<span aria-hidden="true">🔒</span><span class="icon-btn__txt">로그아웃</span>';
    btn.setAttribute('aria-label', '로그아웃');
    btn.addEventListener('click', () => {
      try { sessionStorage.removeItem(KEY_STORE); } catch (e) { /* 무시 */ }
      location.reload();   // 창 전역의 리스너가 쌓이지 않도록 반드시 전체 새로고침
    });
    bar.appendChild(btn);
  }

  /* 설명서: 비동기 복호화 뒤에 window.open 하면 팝업 차단에 걸린다 → 클릭 순간 빈 탭을 먼저 연다. */
  function wireManual() {
    document.addEventListener('click', async (e) => {
      const a = e.target && e.target.closest ? e.target.closest('[data-locked-manual]') : null;
      if (!a) return;
      e.preventDefault();
      const w = window.open('', '_blank');
      try {
        if (w) w.document.write('<p style="font-family:system-ui;padding:24px">사용 설명서를 여는 중…</p>');
        const res = await nativeFetch('manual/manual.enc?b=' + build, { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const plain = await openSealed(await res.arrayBuffer());
        const url = URL.createObjectURL(new Blob([plain], { type: 'application/pdf' }));
        if (w && !w.closed) {
          w.location.href = url;
        } else {
          const link = document.createElement('a');
          link.href = url;
          link.download = 'SafeVessel_사용설명서.pdf';
          document.body.appendChild(link);
          link.click();
          link.remove();
        }
        setTimeout(() => URL.revokeObjectURL(url), 5 * 60 * 1000);
      } catch (err) {
        if (w && !w.closed) w.close();
        alert('사용 설명서를 열지 못했습니다. 잠시 뒤 다시 시도하세요.');
      }
    });
  }

  function mount(bundle) {
    installFetch();
    document.title = bundle.title;
    const style = document.createElement('style');
    style.textContent = bundle.css;
    document.head.appendChild(style);
    const lockStyle = $('lockStyle');
    if (lockStyle) lockStyle.remove();
    document.body.innerHTML = bundle.body;
    addLogout();
    wireManual();
    for (const s of bundle.scripts) {
      const el = document.createElement('script');
      el.textContent = s.code + '\n//# sourceURL=' + s.name;
      document.body.appendChild(el);
    }
  }

  async function tryResume() {
    let saved = null;
    try { saved = JSON.parse(sessionStorage.getItem(KEY_STORE) || 'null'); } catch (e) { saved = null; }
    if (!saved || saved.build !== build || !saved.k) {
      try { sessionStorage.removeItem(KEY_STORE); } catch (e) { /* 무시 */ }
      return false;
    }
    setBusy(true, '화면을 여는 중…');
    try {
      KEY = await crypto.subtle.importKey('raw', b64d(saved.k), { name: 'AES-GCM' }, false, ['decrypt']);
      mount(await loadBundle());
      return true;
    } catch (e) {
      KEY = null;
      try { sessionStorage.removeItem(KEY_STORE); } catch (e2) { /* 무시 */ }
      setBusy(false);
      return false;
    }
  }

  /* 앱 안에 딸린 브라우저(인앱 브라우저)로 열렸는가.
     카카오톡 인앱 브라우저는 입력칸·키보드 처리가 불안정하다 —
     2026-09-30 실제로 카톡 링크로 열면 글자가 안 쳐지고, 같은 폰 크롬에서는 정상이었다.
     고칠 수 있는 쪽이 아니므로 **기본 브라우저로 넘겨 준다.**
     카카오톡은 주소에 openExternalBrowser=1 이 있으면 스스로 외부 브라우저로 연다(카카오 공식 방식). */
  (function inappGuard() {
    const ua = navigator.userAgent || '';
    const isKakao = /KAKAOTALK/i.test(ua);
    const isOtherInapp = /(FBAN|FBAV|FB_IAB|Instagram|Line\/|NAVER\(inapp|DaumApps|everytimeApp)/i.test(ua);
    if (!isKakao && !isOtherInapp) return;

    const bar = $('inappBar');
    const btn = $('inappOpen');
    if (!bar || !btn) return;
    if (!isKakao) {
      bar.querySelector('b').textContent = '지금 앱 안의 브라우저로 열렸습니다.';
    }
    bar.hidden = false;

    btn.addEventListener('click', () => {
      const u = new URL(location.href);
      if (isKakao) {
        u.searchParams.set('openExternalBrowser', '1');
        location.href = u.toString();
        return;
      }
      // 안드로이드는 크롬으로 직접 넘긴다. 실패하면 주소가 그대로 남아 사용자가 복사할 수 있다.
      if (/Android/i.test(ua)) {
        location.href = 'intent://' + u.host + u.pathname + u.search
          + '#Intent;scheme=' + u.protocol.replace(':', '') + ';package=com.android.chrome;end';
      } else {
        window.open(u.toString(), '_blank', 'noopener');
      }
    });
  })();

  /* 이 브라우저가 CSS 로 글자를 가릴 수 있는가.
     못 가리면 비밀번호가 그대로 보이게 둘 수 없으므로 type="password" 로 되돌린다
     (그 브라우저에서는 자동완성 시트가 뜰 수 있지만, 보이는 것보다는 낫다). */
  (function ensureMasking() {
    const pw = $('loginPw');
    if (!pw) return;
    const ok = CSS && CSS.supports
      && (CSS.supports('-webkit-text-security', 'disc') || CSS.supports('text-security', 'disc'));
    if (!ok) {
      pw.classList.remove('is-secret');
      pw.type = 'password';
      pw.setAttribute('autocomplete', 'off');
    }
  })();

  $('pwToggle').addEventListener('click', () => {
    const pw = $('loginPw');
    // ⚠️ type 을 바꾸지 않는다 — 휴대폰에서 type 변경은 입력칸을 다시 만들어 키보드를 닫는다.
    const hidden = pw.type === 'password' ? true : pw.classList.contains('is-secret');
    if (pw.type === 'password') {
      pw.type = hidden ? 'text' : 'password';   // CSS 가림을 못 쓰는 브라우저의 폴백 경로
    } else {
      pw.classList.toggle('is-secret', !hidden);
    }
    $('pwToggle').textContent = hidden ? '숨기기' : '보기';
    $('pwToggle').setAttribute('aria-pressed', hidden ? 'true' : 'false');
  });

  /* 폼이 없으므로 '제출'은 우리가 직접 만든다 — 버튼을 누르거나 입력칸에서 Enter. */
  $('loginBtn').addEventListener('click', () => submitLogin());
  for (const id of ['loginId', 'loginPw']) {
    $(id).addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); submitLogin(); }
    });
  }

  async function submitLogin() {
    const idEl = $('loginId');
    const pwEl = $('loginPw');
    const id = idEl.value.trim();
    const pw = pwEl.value;
    idEl.removeAttribute('aria-invalid');
    pwEl.removeAttribute('aria-invalid');
    if (!id || !pw) {
      const target = !id ? idEl : pwEl;
      target.setAttribute('aria-invalid', 'true');
      showError(!id ? '아이디를 입력하세요.' : '비밀번호를 입력하세요.');
      if (!COARSE) target.focus();   // 손가락 기기에서는 키보드가 닫힌다
      return;
    }
    showError('');
    setBusy(true, '확인 중…');
    try {
      KEY = await deriveKey(id, pw);
      const bundle = await loadBundle();
      const raw = new Uint8Array(await crypto.subtle.exportKey('raw', KEY));
      try { sessionStorage.setItem(KEY_STORE, JSON.stringify({ build: build, k: b64e(raw) })); } catch (e2) { /* 저장 불가 — 이번 탭에서만 */ }
      KEY = await crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['decrypt']);
      raw.fill(0);
      mount(bundle);
    } catch (err) {
      KEY = null;
      if (err && err.bad && await ensureFresh('login')) return;   // 새 버전 → 새로고침 중
      setBusy(false);
      if (err && err.bad) {
        pwEl.setAttribute('aria-invalid', 'true');
        showError('아이디 또는 비밀번호가 올바르지 않습니다.');
        // 손가락 기기에서는 포커스를 건드리지 않는다 — 올라와 있는 키보드가 닫힌다.
        if (!COARSE) { pwEl.select(); pwEl.focus(); }
      } else {
        showError('화면을 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 시도하세요.');
      }
    }
  }

  /* 사용자가 화면을 이미 만졌는가.
     폰에서 사용자가 입력칸을 탭해 키보드가 올라온 뒤에 프로그램이 focus() 를 걸면
     모바일 브라우저가 키보드를 닫아 버린다(2026-09-30 실제 보고). 만졌으면 손대지 않는다. */
  let userTouched = false;
  for (const ev of ['pointerdown', 'touchstart', 'focusin', 'keydown']) {
    document.addEventListener(ev, () => { userTouched = true; }, { once: true, passive: true });
  }
  /* 손가락 기기에서는 자동 포커스를 아예 하지 않는다 — 열자마자 키보드가 튀어 오르는 것도 나쁘다. */
  const COARSE = window.matchMedia && matchMedia('(pointer: coarse)').matches;

  function focusIdIfIdle() {
    if (userTouched || COARSE) return;
    const el = $('loginId');
    if (el && document.activeElement !== el) el.focus();
  }

  /* 진단 모드 — 주소 끝에 ?diag=1 을 붙였을 때만 켜진다.
     휴대폰에서 "키보드가 왜 내려가는지" 는 헤드리스 브라우저로 재현되지 않는다(키보드가 없다).
     그래서 폰이 직접 겪은 일을 화면에 적게 한다. 창 높이(innerHeight)가 키보드의 대리 지표다 —
     키보드가 올라오면 줄고, 내려가면 늘어난다.
     ⚠️ 친 글자는 절대 적지 않는다. 길이만 센다. */
  function startDiag() {
    if (!/[?&]diag=1/.test(location.search)) return;
    const box = document.createElement('div');
    box.setAttribute('style', 'position:fixed;left:0;right:0;bottom:0;max-height:46vh;overflow:auto;'
      + 'background:#0b0b0b;color:#b7f7c0;font:11px/1.45 ui-monospace,monospace;padding:8px;z-index:99999;'
      + 'white-space:pre-wrap;word-break:break-all');
    const lines = [];
    let h0 = window.innerHeight;
    const t0 = Date.now();
    function put(what) {
      lines.push(String(Date.now() - t0).padStart(5, ' ') + 'ms  h=' + window.innerHeight + '  ' + what);
      if (lines.length > 60) lines.shift();
      box.textContent = lines.join('\n');
      box.scrollTop = box.scrollHeight;
    }
    const who = (t) => (t && (t.id || t.tagName)) || '?';
    for (const ev of ['focusin', 'focusout']) {
      document.addEventListener(ev, (e) => put(ev + ' ' + who(e.target)), true);
    }
    document.addEventListener('input', (e) => put('input ' + who(e.target) + ' 글자수=' + (e.target.value || '').length), true);
    document.addEventListener('keydown', (e) => put('keydown ' + (e.key === ' ' ? 'Space' : e.key.length === 1 ? '글자' : e.key)), true);
    for (const ev of ['pointerdown', 'touchstart']) {
      document.addEventListener(ev, (e) => put(ev + ' ' + who(e.target)), true);
    }
    window.addEventListener('resize', () => put('창높이 바뀜 (처음 ' + h0 + ' → 지금 ' + window.innerHeight + ')'));
    document.addEventListener('visibilitychange', () => put('visibilitychange ' + document.visibilityState));
    window.addEventListener('pagehide', () => put('pagehide — 화면이 떠난다'));
    window.addEventListener('beforeunload', () => put('beforeunload — 새로고침/이동'));
    document.body.appendChild(box);
    put('진단 시작 — 아이디 칸을 눌러 글자를 치고, 하나씩 지워 보세요');
  }

  (async function start() {
    startDiag();
    if (!window.crypto || !crypto.subtle) {
      showError('이 브라우저에서는 열 수 없습니다. 최신 크롬·엣지·사파리·파이어폭스로 https 주소에 접속하세요.');
      setBusy(true, '사용할 수 없음');
      return;
    }
    if (await ensureFresh('start')) return;   // 옛 화면이 캐시에서 열렸으면 여기서 새로고침
    if (await tryResume()) return;
    focusIdIfIdle();
  })();
})();
</script>
</body>
</html>
